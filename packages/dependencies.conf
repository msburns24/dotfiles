# ==============================================================================
#  packages/dependencies.conf — the tool/dependency manifest read by install.sh
#
#  One dependency per line, three pipe-separated fields:
#
#    Display name  |  presence check  |  install spec
#
#    presence check : shell expression, eval'd by install.sh. Exit 0 = already
#                     installed (shown with a ✓), non-zero = missing (✗).
#    install spec   : how to install it if missing —
#                       apt:<pkg>     a Debian/Ubuntu package (all apt: entries
#                                     are batched into ONE `apt install`).
#                       fn:<name>     a bash function defined in
#                                     scripts/install-lib.sh.
#
#  Adding a new tool later = add one line here (and, for fn:, one function in
#  install-lib.sh). Nothing else to edit. Blank lines and #-comments are ignored.
#  A literal pipe inside a check must be backslash-escaped: \|
# ==============================================================================

# ---- Core system packages (apt) ----------------------------------------------
GNU Stow             | command -v stow                    | apt:stow
curl                 | command -v curl                    | apt:curl
ca-certificates      | dpkg -s ca-certificates >/dev/null 2>&1 | apt:ca-certificates
zsh                  | command -v zsh                     | apt:zsh
git                  | command -v git                     | apt:git
xclip                | command -v xclip                   | apt:xclip
ripgrep              | command -v rg                      | apt:ripgrep
fd                   | command -v fdfind                  | apt:fd-find
build-essential      | command -v gcc                     | apt:build-essential
unzip                | command -v unzip                   | apt:unzip
fontconfig           | command -v fc-cache                | apt:fontconfig

# ---- Hand-rolled tools under ~/.local (GitHub releases / installers) ---------
Neovim               | command -v nvim                    | fn:install_neovim
Kitty                | command -v kitty                   | fn:install_kitty
eza                  | command -v eza                     | fn:install_eza
yazi                 | command -v yazi                    | fn:install_yazi
resvg                | command -v resvg                   | fn:install_resvg
Oh My Posh           | command -v oh-my-posh              | fn:install_ohmyposh

# ---- fd symlink (Debian ships the binary as `fdfind`; nvim expects `fd`) -----
fd -> fd symlink     | command -v fd                      | fn:install_fd_symlink

# ---- Fonts -------------------------------------------------------------------
CascadiaCode Nerd Font | fc-list \| grep -qi Caskaydia    | fn:install_cascadia_font
